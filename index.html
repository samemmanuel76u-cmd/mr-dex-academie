<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. DEX Académie - Plateforme de Cybersécurité</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              950: '#052e16'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 font-bold rounded border border-emerald-500/20 text-sm">DEX</span>
        <h1 class="font-bold text-lg text-slate-100">Mr. DEX Académie</h1>
      </div>
      <div class="flex items-center gap-3 text-sm text-slate-400">
        <span>Progression : <strong id="progress-text" class="text-emerald-400">0/12</strong></span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
      <h2 class="text-2xl font-extrabold text-slate-100 sm:text-3xl">Programme de Formation</h2>
      <p class="text-sm text-slate-400 mt-1">Sélectionnez un module pour commencer votre apprentissage en cybersécurité.</p>
    </div>

    <!-- Conteneur dynamique des 12 modules -->
    <div id="modules-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Les modules s'afficheront ici -->
    </div>
  </main>

  <script>
    // 1. Liste complète des 12 modules
    const modulesData = [
      { id: 1, title: "Module 1 : Introduction à la Cybersécurité", desc: "Les bases de la sécurité, la triade CIA et les types de menaces." },
      { id: 2, title: "Module 2 : Ingénierie Sociale & Phishing", desc: "Identifier les tentatives d'hameçonnage et la manipulation psychologique." },
      { id: 3, title: "Module 3 : Gestion des Mots de Passe & MFA", desc: "Création de mots de passe forts et authentification à deux facteurs." },
      { id: 4, title: "Module 4 : Sécurité du Réseau & Wi-Fi", desc: "Protéger ses connexions, utiliser un VPN et éviter les Wi-Fi publics." },
      { id: 5, title: "Module 5 : Protection des Données Personnelles", desc: "Principes du RGPD, confidentialité et gestion de la vie privée." },
      { id: 6, title: "Module 6 : Malware & Antivirus", desc: "Ransomwares, trojans, spywares et méthodes de protection proactive." },
      { id: 7, title: "Module 7 : Sécurité des Appareils Mobiles", desc: "Protéger smartphones, gestion des permissions et sauvegardes." },
      { id: 8, title: "Module 8 : Navigation Web Sécurisée", desc: "HTTPS, certificats SSL, bloqueurs de pubs et prévention du tracking." },
      { id: 9, title: "Module 9 : Sécurité des E-mails & Messageries", desc: "Chiffrement et détection des pièces jointes suspectes." },
      { id: 10, title: "Module 10 : Sauvegarde & Récupération", desc: "Stratégie de sauvegarde 3-2-1 et plans de continuité." },
      { id: 11, title: "Module 11 : Menaces IA & Deepfakes", desc: "Comprendre les nouvelles menaces générées par l'IA." },
      { id: 12, title: "Module 12 : Évaluation Finale & Certification", desc: "Examen global récapitulant les 11 modules précédents." }
    ];

    // 2. Fonction d'affichage des cartes
    function afficherModules() {
      const container = document.getElementById('modules-list');
      if (!container) return;

      container.innerHTML = '';

      modulesData.forEach((mod) => {
        const card = document.createElement('div');
        card.className = "p-5 border border-slate-800 bg-slate-900 rounded-xl shadow-sm hover:border-emerald-500/50 transition-all flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold px-2 py-1 bg-emerald-950 text-emerald-400 rounded border border-emerald-800">
                Module ${mod.id}/12
              </span>
            </div>
            <h3 class="text-lg font-bold text-slate-100 mb-2">${mod.title}</h3>
            <p class="text-xs text-slate-400 leading-relaxed mb-4">${mod.desc}</p>
          </div>
          <button onclick="alert('Chargement du ${mod.title}')" class="w-full py-2 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold transition-colors mt-auto">
            Accéder au cours
          </button>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', afficherModules);
  </script>
</body>
</html>
